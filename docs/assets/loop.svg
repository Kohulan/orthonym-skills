    <text x="896.0" y="159.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="800" fill="#07161f">5</text>
    <text x="970" y="177" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f1f5f9">spy-site</text>
