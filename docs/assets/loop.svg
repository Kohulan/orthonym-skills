  <text x="505" y="281.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#f9a8d4" fill-opacity="0.85">before any run &gt; 1 min</text>
  <path d="M760 289.0 L723 325.0" stroke="#f472b6" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="3 5"/>
  <rect x="642" y="247.0" width="237" height="42" rx="21" fill="#f472b6" fill-opacity="0.09" stroke="#f472b6" stroke-opacity="0.6" stroke-dasharray="4 4"/>
  <text x="760" y="265.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#fbcfe8">watching-background-jobs</text>
  <text x="760" y="281.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#f9a8d4" fill-opacity="0.85">while the gate runs</text>
  <circle r="6" fill="#fff" filter="url(#glow)">
    <animateMotion dur="12s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>
  <g>
    <rect x="150.0" y="149.0" width="160" height="62" rx="14" fill="#0b1d27"/>
    <rect x="150.0" y="149.0" width="160" height="62" rx="14" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.8" stroke-width="1.5"/>
