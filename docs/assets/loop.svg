  <text x="120.0" y="268.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 120.0 268.0)">next session</text>
