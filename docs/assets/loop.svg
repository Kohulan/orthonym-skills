<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
  <title id="t">The session loop</title>
  <desc id="d">kickoff, run-eval, cluster-failures and refusal-census, check-target, spy-site, build at the root with understand-before-merge, run-gate, fable-review, handoff, then the next session starts again at kickoff. reuse-before-rerun fires before any measurement longer than a minute; watching-background-jobs fires while the gate runs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07161f"/><stop offset="0.55" stop-color="#0c2a36"/><stop offset="1" stop-color="#171640"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1.2" fill="#fff" fill-opacity="0.08"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="480" rx="22"/></clipPath>
    <path id="track" d="M230 180 H970 A88.0 88.0 0 0 1 970 356 H230 A88.0 88.0 0 0 1 230 180 Z"/>
  </defs>
  <g clip-path="url(#card)"><rect width="1200" height="480" fill="url(#bg)"/><rect width="1200" height="480" fill="url(#dots)"/></g>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="22" fill="none" stroke="#fff" stroke-opacity="0.08"/>
  <text x="48" y="58" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="3" fill="#5eead4">THE SESSION LOOP</text>
  <text x="48" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Measure, pick one real class, prove the site, fix at the root, <tspan fill="url(#accent)">gate.</tspan></text>

  <use href="#track" fill="none" stroke="#fff" stroke-opacity="0.05" stroke-width="16"/>
  <use href="#track" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.4s" repeatCount="indefinite"/>
  </use>
  <path d="M-4 -6 L4 0 L-4 6" transform="translate(322.5 180) rotate(0)" fill="none" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
