    <circle cx="526.0" cy="155.0" r="11" fill="#38bdf8" stroke="#07161f" stroke-width="2"/>
    <text x="526.0" y="159.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="800" fill="#07161f">3</text>
    <text x="600" y="177" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f1f5f9">cluster-failures</text>
