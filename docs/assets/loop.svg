    <circle cx="896.0" cy="331.0" r="11" fill="#a78bfa" stroke="#07161f" stroke-width="2"/>
    <text x="896.0" y="335.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="800" fill="#07161f">6</text>
    <text x="970" y="353" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f1f5f9">build at root</text>
    <text x="970" y="372" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8">understand-before-merge</text>
