<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">What the output looks like</title>
  <desc id="d">reuse-before-rerun ends a reply that reports a number with an Existing, Verdict and Cost block. watching-background-jobs reports one progress line per wake-up.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07161f"/><stop offset="0.55" stop-color="#0c2a36"/><stop offset="1" stop-color="#171640"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="400" rx="22"/></clipPath>
    <clipPath id="prog"><rect x="0" y="0" width="0" height="8"><animate attributeName="width" values="0;428;428" keyTimes="0;0.85;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <g clip-path="url(#card)"><rect width="1200" height="400" fill="url(#bg)"/></g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="22" fill="none" stroke="#fff" stroke-opacity="0.08"/>
  <!-- window chrome -->
  <rect x="0" y="0" width="1200" height="52" rx="22" fill="#ffffff" fill-opacity="0.04" clip-path="url(#card)"/>
  <rect x="0" y="51" width="1200" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="34" cy="26" r="7" fill="#f87171"/><circle cx="58" cy="26" r="7" fill="#fbbf24"/><circle cx="82" cy="26" r="7" fill="#34d399"/>
  <text x="600" y="31" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">claude — ~/your-chem-project</text>
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16">
    <text x="48" y="110" xml:space="preserve"><tspan fill="#2dd4bf" font-weight="700">❯ </tspan><tspan fill="#f1f5f9" font-weight="400">what is our accuracy on the held-out split?</tspan></text>
    <text x="48" y="146" xml:space="preserve"><tspan fill="#64748b" font-weight="400"># reuse-before-rerun</tspan></text>
    <text x="48" y="174" xml:space="preserve"><tspan fill="#a78bfa" font-weight="700">Existing: </tspan><tspan fill="#cbd5e1" font-weight="400">results/h2h/summary_chebifull_*.json · 2026-08-31 · HEAD 4133b60e</tspan></text>
    <text x="48" y="200" xml:space="preserve"><tspan fill="#a78bfa" font-weight="700">Verdict:  </tspan><tspan fill="#34d399" font-weight="800">REUSE</tspan><tspan fill="#cbd5e1" font-weight="400"> — no commits to src/ since the run date</tspan></text>
    <text x="48" y="226" xml:space="preserve"><tspan fill="#a78bfa" font-weight="700">Cost:     </tspan><tspan fill="#cbd5e1" font-weight="400">0 (reused)</tspan></text>
    <text x="48" y="270" xml:space="preserve"><tspan fill="#64748b" font-weight="400"># watching-background-jobs</tspan></text>
    <text x="48" y="298" xml:space="preserve"><tspan fill="#fbbf24" font-weight="700">gate</tspan><tspan fill="#cbd5e1" font-weight="400"> · 2100/5000 (42%) · 40/min · ETA 08:43 UTC · last: </tspan><tspan fill="#94a3b8" font-weight="400">"[2100/5000] row ok"</tspan></text>
  </g>
  <!-- progress bar -->
  <rect x="48" y="322" width="1020" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
  <g transform="translate(48 322)"><rect width="1020" height="8" rx="4" fill="url(#bar)" clip-path="url(#prog)"/></g>
  <text x="1084" y="330" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#64748b">42%</text>
  <text x="48" y="366" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="16" fill="#2dd4bf" font-weight="700">❯ </text>
  <rect x="70" y="352" width="10" height="18" fill="#e2e8f0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
