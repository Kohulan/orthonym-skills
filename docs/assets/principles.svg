<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">Six gaps, six skills</title>
  <desc id="d">Each skill closes one gap in the chain of reasoning: spy-site, check-target, reuse-before-rerun, bounded-goals, fable-review, refusal-census.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07161f"/><stop offset="0.55" stop-color="#0c2a36"/><stop offset="1" stop-color="#171640"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1.2" fill="#fff" fill-opacity="0.08"/></pattern>
    <clipPath id="card"><rect width="1200" height="470" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="470" fill="url(#bg)"/><rect width="1200" height="470" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="22" fill="none" stroke="#fff" stroke-opacity="0.08"/>
  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
    <text x="48" y="58" font-size="13" font-weight="600" letter-spacing="3" fill="#5eead4">THE FAILURE MODE</text>
  </g>
  <text x="48" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">A confident-but-wrong premise passes every test. <tspan fill="url(#accent)">Each skill closes one gap.</tspan></text>
  <g>
    <rect x="48" y="120" width="352" height="150" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="48" y="140" width="3" height="110" rx="1.5" fill="#2dd4bf">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.6s" begin="0.00s" repeatCount="indefinite"/>
    </rect>
    <text x="72" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2dd4bf" letter-spacing="1">01</text>
    <text x="72" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9">Prove the site is on the path</text>
    <text x="72" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-style="italic" fill="#94a3b8">before you edit it</text>
    <rect x="72" y="232" width="85" height="24" rx="12" fill="#2dd4bf" fill-opacity="0.13" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="83" y="248.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e2e8f0">spy-site</text>
  </g>
  <g>
    <rect x="424" y="120" width="352" height="150" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="424" y="140" width="3" height="110" rx="1.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.6s" begin="0.35s" repeatCount="indefinite"/>
    </rect>
    <text x="448" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">02</text>
    <text x="448" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9">Prove the target is a real defect</text>
    <text x="448" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-style="italic" fill="#94a3b8">before you build</text>
    <rect x="448" y="232" width="117" height="24" rx="12" fill="#38bdf8" fill-opacity="0.13" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="459" y="248.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e2e8f0">check-target</text>
  </g>
  <g>
    <rect x="800" y="120" width="352" height="150" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="800" y="140" width="3" height="110" rx="1.5" fill="#60a5fa">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.6s" begin="0.70s" repeatCount="indefinite"/>
    </rect>
    <text x="824" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="1">03</text>
    <text x="824" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9">Reuse the result you already have</text>
    <text x="824" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-style="italic" fill="#94a3b8">before you re-measure for four hours</text>
    <rect x="824" y="232" width="164" height="24" rx="12" fill="#60a5fa" fill-opacity="0.13" stroke="#60a5fa" stroke-opacity="0.55"/>
    <text x="835" y="248.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e2e8f0">reuse-before-rerun</text>
  </g>
  <g>
    <rect x="48" y="294" width="352" height="150" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="48" y="314" width="3" height="110" rx="1.5" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.6s" begin="1.05s" repeatCount="indefinite"/>
    </rect>
    <text x="72" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#a78bfa" letter-spacing="1">04</text>
    <text x="72" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9">Bound your objectives</text>
    <text x="72" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-style="italic" fill="#94a3b8">before you optimise</text>
    <rect x="72" y="406" width="125" height="24" rx="12" fill="#a78bfa" fill-opacity="0.13" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="83" y="422.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e2e8f0">bounded-goals</text>
  </g>
  <g>
    <rect x="424" y="294" width="352" height="150" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="424" y="314" width="3" height="110" rx="1.5" fill="#e879f9">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.6s" begin="1.40s" repeatCount="indefinite"/>
    </rect>
    <text x="448" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e879f9" letter-spacing="1">05</text>
    <text x="448" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9">Get an adversarial second opinion</text>
    <text x="448" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-style="italic" fill="#94a3b8">before you ship a load-bearing claim</text>
    <rect x="448" y="406" width="117" height="24" rx="12" fill="#e879f9" fill-opacity="0.13" stroke="#e879f9" stroke-opacity="0.55"/>
    <text x="459" y="422.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e2e8f0">fable-review</text>
  </g>
  <g>
    <rect x="800" y="294" width="352" height="150" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="800" y="314" width="3" height="110" rx="1.5" fill="#f472b6">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.6s" begin="1.75s" repeatCount="indefinite"/>
    </rect>
    <text x="824" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f472b6" letter-spacing="1">06</text>
    <text x="824" y="366" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#f1f5f9">Attribute every failure to its site</text>
    <text x="824" y="390" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-style="italic" fill="#94a3b8">before you rank the build order</text>
    <rect x="824" y="406" width="133" height="24" rx="12" fill="#f472b6" fill-opacity="0.13" stroke="#f472b6" stroke-opacity="0.55"/>
    <text x="835" y="422.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e2e8f0">refusal-census</text>
  </g>
</svg>
